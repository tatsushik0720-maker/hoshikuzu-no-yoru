<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星屑のよる">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f1fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b1d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*{touch-action:pan-x pan-y}</style>
<script>
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
<title>星屑のよる</title>
<style>
/* ===== 色（明るい表示） ===== */
:root{
  --bg:#f3f1fb; --fg:#1f1b3a; --sub:#6f6a8f; --panel:#ffffff; --line:#e0dcf2;
  --accent:#6c4cf5; --onaccent:#ffffff; --gold:#9a6200; --good:#12996a; --bad:#d93a48; --soft:#ebe7fb;
}
/* ===== 色（暗い表示）：自動のときと、ダーク固定のときの2か所に同じ中身を書く ===== */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0b1d; --fg:#f2f0ff; --sub:#9a96bd; --panel:#17152e; --line:#2a2750;
    --accent:#9d85ff; --onaccent:#120f2b; --gold:#ffc247; --good:#3ddc97; --bad:#ff6b7a; --soft:#211e42;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0b1d; --fg:#f2f0ff; --sub:#9a96bd; --panel:#17152e; --line:#2a2750;
  --accent:#9d85ff; --onaccent:#120f2b; --gold:#ffc247; --good:#3ddc97; --bad:#ff6b7a; --soft:#211e42;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{
  display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
/* ===== 上のバー ===== */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;width:100%;max-width:560px;margin:0 auto}
.top h1{margin:0;font-size:20px;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.chip svg{width:16px;height:16px}
/* ===== 真ん中 ===== */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
main>section{max-width:560px;margin:0 auto;padding:4px 16px 24px}
h2{font-size:14px;color:var(--sub);margin:20px 4px 8px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.note{font-size:13px;color:var(--sub);margin:6px 4px}
#hero{display:block;width:100%;height:150px;border-radius:20px;margin-bottom:12px}
/* ステージ */
.stage{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:10px;transition:transform .12s ease-out,border-color .15s}
.stage:active{transform:scale(.98)}
.stage.sel{border-color:var(--accent)}
.stage.lock{opacity:.5}
.stage .moon{width:40px;height:40px;flex:none}
.stage b{display:block;font-size:17px}
.stage small{display:block;font-size:13px;color:var(--sub);line-height:1.4}
.stage .best{margin-left:auto;text-align:right;font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.stage .best i{font-style:normal;color:var(--good);font-weight:700}
.big{display:block;width:100%;background:var(--accent);color:var(--onaccent);font-size:19px;font-weight:700;padding:15px;border-radius:16px;
  transition:transform .12s ease-out}
.big:active{transform:scale(.97)}
.ghost{display:block;width:100%;background:var(--soft);font-weight:700;padding:13px;border-radius:14px;transition:transform .12s ease-out}
.ghost:active{transform:scale(.97)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.resume{border-color:var(--accent)}
.resume p{margin:0 0 10px}
.warn{border-color:var(--gold)}
/* 強化 */
.up{display:flex;align-items:center;gap:12px}
.up .ic{width:40px;height:40px;flex:none}
.up .tx{flex:1;min-width:0}
.up b{display:block}
.up small{display:block;font-size:13px;color:var(--sub);line-height:1.4}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.buy{flex:none;min-width:76px;min-height:44px;border-radius:12px;background:var(--accent);color:var(--onaccent);font-weight:700;padding:6px 10px;
  font-variant-numeric:tabular-nums;transition:transform .12s ease-out}
.buy:active{transform:scale(.95)}
.buy[disabled]{background:var(--soft);color:var(--sub)}
/* 記録 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0;text-align:center;padding:12px 8px}
.grid small{display:block;font-size:12px;color:var(--sub)}
.grid b{font-size:22px;font-variant-numeric:tabular-nums}
.ach{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border:0}
.ach .md{width:30px;height:30px;border-radius:50%;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--sub);font-weight:700}
.ach.on .md{background:#ffc247;color:#2a1d00}
.ach b{display:block;line-height:1.3}
.ach small{font-size:13px;color:var(--sub)}
.ach:not(.on) b{color:var(--sub)}
/* 設定 */
.list{padding:0 16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .ck{color:var(--accent);font-weight:700}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.3,.6,1);box-shadow:0 1px 3px #0003}
.item[aria-checked="true"] .sw{background:var(--accent)}
.item[aria-checked="true"] .sw::after{transform:translateX(20px)}
.how li{margin-bottom:6px}
.how{margin:0;padding-left:20px;font-size:15px}
.danger{color:var(--bad)}
/* ===== 下のタブ ===== */
.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--sub);font-weight:700}
.tabs svg{width:24px;height:24px;transition:transform .15s ease-out}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button:active svg{transform:scale(.88)}
/* ===== ゲーム画面 ===== */
#game{position:fixed;inset:0;background:#0b0a1f;z-index:10;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;pointer-events:none;color:#fff;
  text-shadow:0 1px 3px #000a;font-variant-numeric:tabular-nums}
#game.lt #hud{color:#1f1b3a;text-shadow:0 1px 2px #fffa}
.bar{height:8px;border-radius:4px;background:#ffffff26;overflow:hidden}
#game.lt .bar{background:#1f1b3a26}
.bar i{display:block;height:100%;width:100%;transform-origin:left;border-radius:4px;transition:transform .15s ease-out}
#xpbar i{background:linear-gradient(90deg,#2cc5e8,#9b7bff)}
#hpbar{flex:1;height:10px}
#hpbar i{background:linear-gradient(90deg,#ff5d8f,#ff8a3d)}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.hrow>div{flex:1}
#hLv{font-weight:700}
#hTime{text-align:center;font-size:22px;font-weight:700}
#hRight{display:flex;justify-content:flex-end}
#btnPause{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:#ffffff22;color:inherit;display:grid;place-items:center}
#btnPause svg{width:20px;height:20px}
.hrow2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hrow2 span{display:inline-flex;align-items:center;gap:3px}
.hrow2 svg{width:13px;height:13px}
.hc{color:#ffc247}#game.lt .hc{color:#9a6200}
input{font-size:16px}
@media (display-mode:standalone){.hrow{margin-top:34px}}
#bossbar{margin-top:10px;text-align:center;font-size:13px;font-weight:700}
#bossbar .bar{height:10px;margin-top:2px}
#bossbar i{background:linear-gradient(90deg,#c084fc,#ff5d8f)}
#banner{opacity:0;position:absolute;left:0;right:0;top:30%;text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 12px #000}
#game.lt #banner{color:#1f1b3a;text-shadow:0 2px 12px #fff}
#banner b{display:block;font-size:26px;letter-spacing:.08em}
#banner small{font-size:15px}
#banner.show{animation:ban 2.6s ease-out both}
@keyframes ban{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
/* 重ねる画面（レベルアップ・一時停止・結果） */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:#0b0a1fcc;color:#f2f0ff;overflow-y:auto;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.ov h3{margin:0;font-size:24px;letter-spacing:.06em}
.ov p{margin:0;color:#b9b5dc;font-size:14px;text-align:center}
.ov .in{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#1d1a3c;border:2px solid #37336a;border-radius:16px;
  padding:12px 14px;color:#f2f0ff;transition:transform .12s ease-out,opacity .2s;animation:rise .28s cubic-bezier(.2,.9,.3,1.1) both}
.pick:nth-child(2){animation-delay:.05s}.pick:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pick:active{transform:scale(.97)}
.pick img{width:44px;height:44px;flex:none}
.pick b{display:block;font-size:17px}
.pick b em{font-style:normal;font-size:12px;margin-left:8px;padding:1px 8px;border-radius:999px;background:#37336a;color:#cfc9ff;vertical-align:2px}
.pick b em.new{background:#ffc247;color:#2a1d00}
.pick small{display:block;font-size:14px;color:#b9b5dc;line-height:1.4}
.wait .pick{pointer-events:none;opacity:.75}
.ov .big{background:#9d85ff;color:#120f2b}
.ov .ghost{background:#2a2750;color:#f2f0ff}
.build{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.build span{display:inline-flex;align-items:center;gap:4px;background:#1d1a3c;border-radius:10px;padding:4px 8px 4px 4px;font-size:13px;font-weight:700}
.build img{width:24px;height:24px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res div{background:#1d1a3c;border-radius:12px;padding:8px;text-align:center}
.res small{display:block;font-size:12px;color:#b9b5dc}
.res b{font-size:20px;font-variant-numeric:tabular-nums}
#resCoin{font-size:30px;font-weight:700;color:#ffc247;text-align:center;font-variant-numeric:tabular-nums}
#resNew{color:#ffc247;font-weight:700;text-align:center}
#resAch{font-size:14px;text-align:center;color:#3ddc97;font-weight:700;white-space:pre-line}
/* お知らせと確認 */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-20px);background:var(--fg);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s ease-out;z-index:40;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confirm{position:fixed;inset:0;z-index:30;background:#0008;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
#confirm .box{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:340px}
#confirm p{margin:0 0 16px;white-space:pre-line}
#confirm .ok{background:var(--accent);color:var(--onaccent)}
#confirm .ok.danger{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
<style>
html{position:fixed;top:0;right:0;bottom:0;left:0;height:auto;padding:0;overflow:hidden}
body{position:absolute;top:0;right:0;bottom:0;left:0;height:auto;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px)}
@media (display-mode: standalone) {
  html{position:static;height:100lvh;overflow:visible}
  body{position:static;height:100lvh;overflow:visible}
  #game,#confirm{bottom:auto;height:100lvh}
  .top{padding-top:10px}
}
</style>

</head>
<body>


<div class="top">
  <h1>星屑のよる</h1>
  <div class="chip" aria-label="星のかけら"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg><span id="coinChip">0</span></div>
</div>

<main id="main">
  <section id="pgPlay"></section>
  <section id="pgUp" hidden></section>
  <section id="pgRec" hidden></section>
  <section id="pgSet" hidden></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="Play" aria-selected="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c.5 4.8 2.2 6.500 7 7-4.800.5-6.500 2.200-7 7-.5-4.800-2.200-6.500-7-7 4.800-.5 6.500-2.200 7-7zM19 15c.2 2 .9 2.800 3 3-2.100.2-2.800 1-3 3-.2-2-.9-2.800-3-3 2.100-.2 2.800-1 3-3z"/></svg>あそぶ</button>
  <button data-tab="Up" aria-selected="false"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l7 8h-4v9H9v-9H5z"/></svg>つよくする</button>
  <button data-tab="Rec" aria-selected="false"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 3h12v3h3v3a4 4 0 01-4 4h-.6A5 5 0 0113 15.900V18h3v3H8v-3h3v-2.100A5 5 0 017.600 13H7a4 4 0 01-4-4V6h3zm0 5H5v1a2 2 0 001 1.700zm12 0v2.700A2 2 0 0019 9V8z"/></svg>きろく</button>
  <button data-tab="Set" aria-selected="false"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6h10v2H4zm14 0h2v2h-2zM4 11h4v2H4zm8 0h8v2h-8zM4 16h10v2H4zm14 0h2v2h-2z"/><circle cx="16" cy="7" r="2.500" fill="currentColor"/><circle cx="10" cy="12" r="2.500" fill="currentColor"/><circle cx="16" cy="17" r="2.500" fill="currentColor"/></svg>せってい</button>
</nav>

<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bar" id="xpbar"><i></i></div>
    <div class="hrow">
      <div id="hLv">Lv 1</div>
      <div id="hTime">5:00</div>
      <div id="hRight"><button id="btnPause" aria-label="一時停止"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button></div>
    </div>
    <div class="hrow2">
      <div class="bar" id="hpbar"><i></i></div>
      <span><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a8 8 0 00-8 8c0 3 1.500 5 3 6v3h3v-2h1v2h2v-2h1v2h3v-3c1.500-1 3-3 3-6a8 8 0 00-8-8zM9 9a2 2 0 110 4 2 2 0 010-4zm6 0a2 2 0 110 4 2 2 0 010-4z"/></svg><b id="hKill">0</b></span>
      <span class="hc"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg><b id="hCoin">0</b></span>
    </div>
    <div id="bossbar" hidden><span id="bossName"></span><div class="bar"><i></i></div></div>
  </div>
  <div id="banner"><b></b><small></small></div>
  <div id="flash"></div>
  <div class="ov" id="ovLvl" hidden><h3>レベルアップ</h3><p>ひとつ えらぼう</p><div class="in" id="picks"></div><div class="in"><button class="ghost" id="btnReroll"></button></div></div>
  <div class="ov" id="ovPause" hidden><h3>ひとやすみ</h3><div class="build" id="pBuild"></div><div class="in"><button class="big" id="btnResume">つづける</button><button class="ghost" id="btnQuit">ここでやめる</button></div><p>やめても、集めた星のかけらは持ち帰れます</p></div>
  <div class="ov" id="ovRes" hidden><h3 id="resTitle"></h3><p id="resSub"></p><div id="resNew" hidden>きろく更新！</div>
    <div class="in"><div class="res"><div><small>生きのびた時間</small><b id="resTime"></b></div><div><small>たおした数</small><b id="resKill"></b></div><div><small>レベル</small><b id="resLv"></b></div><div><small>ステージ</small><b id="resStage" style="font-size:16px"></b></div></div>
    <div id="resCoin"></div><div id="resAch"></div><div class="build" id="rBuild"></div>
    <button class="big" id="btnAgain">もういちど</button><button class="ghost" id="btnHome">ホームへ</button></div></div>
</div>

<div id="confirm" hidden><div class="box"><p id="cfMsg"></p><div class="row2"><button class="ghost" id="cfNo">やめておく</button><button class="ghost ok" id="cfOk"></button></div></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const KEY="hoshikuzu-no-yoru-v1", TAU=Math.PI*2;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmtT=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const STAR='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>';

/* ================= データの定義 ================= */
const STAGES=[
  {id:"yoi",name:"よいのくち",desc:"はじめての夜。まずはここから",hp:1,rate:1,dmg:1,coin:1,len:300,col:"#ffc247"},
  {id:"mayo",name:"まよなか",desc:"敵がかたく、数も多い",hp:1.7,rate:1.25,dmg:1.3,coin:1.5,len:300,need:"yoi",col:"#9b7bff"},
  {id:"shin",name:"しんや",desc:"いちばん暗い時間。強化してから挑もう",hp:2.6,rate:1.5,dmg:1.6,coin:2,len:300,need:"mayo",col:"#ff5d8f"},
  {id:"hate",name:"はてなき夜",desc:"夜明けのこない夜。どこまで耐えられるか",hp:1.4,rate:1.3,dmg:1.2,coin:1.5,len:0,need:"shin",col:"#2cc5e8"},
];
const stageOf=id=>STAGES.find(s=>s.id===id);
/* 武器（最大6）と、能力（最大5）。数値はレベルごとの表 */
const WT={

const MAXEN=230;
function spawn(dt){

  while(r.spawnAcc>=1){r.spawnAcc--;if(r.en.length>=MAXEN)continue;const p=ringPos(rand(TAU),r.spawnR*rand(1,1.150));addEnemy(pickType(),p[0],p[1])}
  if(t>=r.nextSwarm){r.nextSwarm+=45;
    if(Math.random()<.5){const n=Math.min(28,12+Math.floor(t/25)),a0=rand(TAU);for(let i=0;i<n&&r.en.length<MAXEN;i++){const p=ringPos(a0+i*TAU/n,r.spawnR);addEnemy(t>60?"bat":"wisp",p[0],p[1])}banner("かこまれた！","")}
    else{const n=Math.min(26,10+Math.floor(t/20)),a=rand(TAU);for(let i=0;i<n&&r.en.length<MAXEN;i++){const p=ringPos(a+rand(-.35,.35),r.spawnR*rand(1,1.350));addEnemy("wisp",p[0],p[1])}}
  }

  /* ボス：150秒ごと。終わりのあるステージは2体目が最後 */
  const due=Math.floor(t/150);

    r.bossUp++;const type=(r.bossUp%2===1)?"boss1":"boss2",p=ringPos(rand(TAU),r.spawnR*.9);
    r.boss=addEnemy(type,p[0],p[1]);banner(ET[type].name+" があらわれた",s.len&&type==="boss2"?"たおせば夜が明ける":"");sfx("boss");vib(120);r.shake=10;
  }

/* ---------- 攻撃 ---------- */
function nearest(x,y,maxd){let best=null,bd=maxd*maxd;for(const e of R.en){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}return best}
function txt(x,y,s,col,big){if(simulating)return;if(R.txt.length>34)R.txt.shift();R.txt.push({x:x+rand(-6,6),y,s,col,t:0,big:!!big})}
function part(x,y,col,n,sp,life,size){if(simulating)return;for(let i=0;i<n&&R.parts.length<320;i++){const a=rand(TAU),v=rand(.3,1)*sp;R.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:life*rand(.6,1),col,size:size||2.500})}}

  part(e.x,e.y,e.col,e.boss?40:e.elite?16:6,e.boss?260:140,.5,e.boss?4:2.500);

  else if(q<.07)drop(e.x,e.y,1,1);else if(q<.076)drop(e.x,e.y,2,1);else if(q<.079)drop(e.x,e.y,3,1);else if(q<.082)drop(e.x,e.y,4,1);

function weapons(dt){
  const r=R,u=r.ups,st=r.st,px=r.px,py=r.py;
  for(const id of WIDS){
    const lv=u[id];if(!lv||id==="orbit")continue;

          let nx=null,bd=120*120*st.area;for(const e of r.en){if(e.dead||hit.includes(e))continue;const dx=e.x-cx,dy=e.y-cy,d=dx*dx+dy*dy;if(d<bd){bd=d;nx=e}}cur=nx}
        r.efx.push({k:"bolt",pts,t:0,T:.2});sfx("bolt")}
    }else if(id==="meteor"){

    }else if(id==="pulse"){
      const rad=T.rad[i]*st.area;if(!nearest(px,py,rad*1.200))ok=false;else{r.efx.push({k:"pulse",t:0,T:.45,rad,dmg:T.dmg[i],hit:new Set(),kb:260});sfx("pulse")}
    }else if(id==="comet"){

      for(let k=0;k<n;k++)r.bul.push({kind:1,x:px,y:py,a:a+k*TAU/n,t:0,T:1.400,r:T.size[i]*st.area,dmg:T.dmg[i],rot:0});sfx("comet");
    }

  }

  const ol=u.orbit;if(ol){const T=WT.orbit,i=ol-1,n=T.n[i],rad=T.rad[i]*st.area,or=8*st.area;r.orbA+=T.spd[i]*dt;
    for(let k=0;k<n;k++){const a=r.orbA+k*TAU/n,ox=px+Math.cos(a)*rad,oy=py+Math.sin(a)*rad;
      for(const e of r.en){if(e.dead||e.oh>0)continue;const dx=e.x-ox,dy=e.y-oy,rr=or+e.r;if(dx*dx+dy*dy<rr*rr){e.oh=.45;const d=Math.hypot(e.x-px,e.y-py)||1;dmgE(e,T.dmg[i],(e.x-px)/d,(e.y-py)/d,170)}}}}
}
function bullets(dt){
  const r=R;

    if(b.kind===0){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0){b.dead=true;continue}
      for(const e of r.en){if(e.dead||e===b.last)continue;const dx=e.x-b.x,dy=e.y-b.y,rr=b.r+e.r;if(dx*dx+dy*dy<rr*rr){const v=Math.hypot(b.vx,b.vy);dmgE(e,b.dmg,b.vx/v,b.vy/v,90);part(b.x,b.y,"#ffc233",3,90,.2);b.last=e;if(b.pierce--<=0){b.dead=true;break}}}
    }else{b.t+=dt;if(b.t>=b.T){b.dead=true;continue}const d=230*Math.sin(Math.PI*b.t/b.T);b.x=r.px+Math.cos(b.a)*d;b.y=r.py+Math.sin(b.a)*d;b.rot+=dt*14;
      for(const e of r.en){if(e.dead||e.ch>0)continue;const dx=e.x-b.x,dy=e.y-b.y,rr=b.r+e.r;if(dx*dx+dy*dy<rr*rr){e.ch=.35;dmgE(e,b.dmg,Math.cos(b.a),Math.sin(b.a),60)}}

function shootE(x,y,a,sp,dmg){if(R.eb.length<160)R.eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg,life:6})}
function hurt(d){

  sfx("hurt");vib(50);part(r.px,r.py,"#ff5d8f",10,160,.4);txt(r.px,r.py-16,"-"+Math.round(d),PAL.hurt,true);

}
function enemies(dt){
  const r=R,px=r.px,py=r.py,es=r.en,dm=r.stage.dmg,kd=Math.pow(.002,dt);
  for(let i=0;i<es.length;i++){const e=es[i];if(e.dead)continue;
    e.flash-=dt;e.oh-=dt;e.ch-=dt;e.born+=dt;
    const dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;let sp=e.spd,mx=ux,my=uy;
    if(e.ai===1){
      if(d<150){mx=-ux;my=-uy}else if(d<215){mx=-uy*e.side;my=ux*e.side;sp*=.6}
      e.t-=dt;if(e.t<=0&&d<330){e.t=2.600;shootE(e.x,e.y,Math.atan2(dy,dx),130,8)}
    }else if(e.ai===2){
      e.t-=dt;
      if(e.s===0){if(d<185&&e.t<=0){e.s=1;e.t=.6;e.ax=ux;e.ay=uy}}
      else if(e.s===1){sp=0;if(e.t<=0){e.s=2;e.t=.5}}

    }else if(e.ai===3){
      e.t-=dt;if(e.t<=0){e.t=2.800;const n=12;for(let k=0;k<n;k++)shootE(e.x,e.y,e.rot+k*TAU/n,105,10);e.rot+=.26}
      e.t2-=dt;if(e.t2<=0){e.t2=9;for(let k=0;k<5&&es.length<MAXEN;k++)addEnemy("bat",e.x+rand(-30,30),e.y+rand(-30,30))}
    }else if(e.ai===4){

      else if(p<6){sp*=.4;if(e.t<=0){e.t=.13;shootE(e.x,e.y,e.rot,120,10);shootE(e.x,e.y,e.rot+Math.PI,120,10);e.rot+=.37}}
      else if(p<6.800){sp=0;e.s=1;e.ax=ux;e.ay=uy}

      const d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),p=(rr-d)/d*.5*Math.min(1,dt*12);const wa=a.boss?0:b.boss?2:1,wb=b.boss?0:a.boss?2:1;a.x-=dx*p*wa;a.y-=dy*p*wa;b.x+=dx*p*wb;b.y+=dy*p*wb}}}

function gainXp(v){R.xp+=v*R.st.xpm;while(R.xp>=R.need){R.xp-=R.need;R.level++;R.need=needXp(R.level);R.pending++}}
function gems(dt){

function choices(){

  for(const d of UPS){const lv=u[d.id]||0;if(lv>=d.max)continue;if(!lv&&(d.kind==="w"?wc>=4:pc>=4))continue;pool.push(d.id)}
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}

}
function applyUp(id){
  if(id==="_heal"){R.hp=Math.min(R.maxhp,R.hp+40)}else if(id==="_coin"){R.coins+=15}

}

}

  const got=[];for(const a of ACH)if(!S.ach[a.id]){let ok=false;try{ok=a.ok(r)}catch(e){}if(ok){S.ach[a.id]=Date.now();S.coins+=ACH_REWARD;S.stats.coins+=ACH_REWARD;got.push(a.name)}}

  else if(a==="resume"){const sn=S.run;if(sn)startGame(stageOf(sn.stage),sn)}

});
/* ---------- バックアップ ---------- */
async function backup(){
  const now=Date.now(),text=JSON.stringify({app:"hoshikuzu-no-yoru",at:now,data:{...S,lastBackup:now}}),d=new Date(now),
    name="hoshikuzu-backup-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".json";
  const done=()=>{S.lastBackup=now;save();renderAll();toast("バックアップを保存しました")};
  try{const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});done();return}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);done()}
  catch(e){toast("保存できませんでした")}
}
$("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;

  rd.onload=()=>{let o=null;try{o=JSON.parse(rd.result)}catch(_){}
    if(!o||o.app!=="hoshikuzu-no-yoru"||!o.data||typeof o.data!=="object"||Array.isArray(o.data)||typeof o.data.coins!=="number"||!o.data.stats){toast("このゲームのバックアップではありません");return}
    ask("バックアップの内容に入れかえます。\n今の記録は上書きされます。","戻す",()=>{S=sanitize(o.data);save();applyTheme();renderAll();toast("バックアップから戻しました")});
  };
  rd.readAsText(f);
});
/* ---------- ホームの絵 ---------- */
let hero=null,hctx=null,hw=0,hh=0;
function sizeHero(){hero=$("hero");if(!hero)return;const d=Math.min(2,devicePixelRatio||1);hw=hero.clientWidth||340;hh=150;hero.width=hw*d;hero.height=hh*d;hctx=hero.getContext("2d");hctx.setTransform(d,0,0,d,0,0)}
function drawHero(t){
  if(!hctx||!hero.isConnected)return;const c=hctx;c.globalAlpha=1;c.globalCompositeOperation="source-over";
  drawBg(c,t*14,Math.sin(t*.3)*20,hw,hh,1,t);
  const x=hw/2,y=hh/2+Math.sin(t*2)*5;
  if(PAL.add)c.globalCompositeOperation="lighter";glow(c,x,y,70,"#ffd34d",.6);c.globalCompositeOperation="source-over";c.globalAlpha=1;
  for(let k=0;k<3;k++){const a=t*1.600+k*TAU/3,ox=x+Math.cos(a)*56,oy=y+Math.sin(a)*22;c.fillStyle="#e6eaff";c.beginPath();c.arc(ox,oy,6,0,TAU);c.fill();c.strokeStyle=PAL.add?"#fff":"#5a5fa8";c.lineWidth=1;c.stroke()}
  drawHoshi(c,x,y,20,t,Math.sin(t*.7)*.6,0,false);
  const cols=["#ff5d8f","#2cc5e8","#9b7bff","#ff8a3d"];
  for(let k=0;k<4;k++){const ex=((k*97+t*(18+k*5))%(hw+60))-30,ey=22+k*34+Math.sin(t*2+k)*6;if(Math.abs(ex-x)<80)continue;c.fillStyle=cols[k];c.globalAlpha=.85;c.beginPath();c.arc(ex,ey,7+k,0,TAU);c.fill();c.globalAlpha=1}
}

/* ================= 毎フレームの処理 ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=last?Math.min(.05,(ts-last)/1000):.016;last=ts;
  if(state==="play"){update(dt);if(R&&state!=="home")draw()}
  else if(R&&(state==="levelup"||state==="pause"||state==="result")){draw()}
  else if(state==="home"&&tab==="Play")drawHero(ts/1000);
}
/* ---------- 自動プレイ（難しさを確かめるための道具。画面には出ない） ---------- */
window.__hoshi={
  get S(){return S},get R(){return R},get state(){return state},start:id=>startGame(stageOf(id||"yoi")),
  sim(stageId,maxSec,skill){
    const keep=JSON.stringify(S);simulating=true;newRun(stageOf(stageId||"yoi"));const log=[];let res="timeout";
    const dt=1/30;for(let i=0;i<maxSec*30;i++){
      let fx=0,fy=0;for(const e of R.en){const dx=R.px-e.x,dy=R.py-e.y,d=Math.hypot(dx,dy);if(d<95*(skill||1)){fx+=dx/d/d;fy+=dy/d/d}}
      for(const b of R.eb){const dx=R.px-b.x,dy=R.py-b.y,d=Math.hypot(dx,dy);if(d<70*(skill||1)){fx+=dx/d/d*2;fy+=dy/d/d*2}}
      let g=null,gd=1e9;for(const o of R.gems){const d=Math.hypot(o.x-R.px,o.y-R.py);if(d<gd){gd=d;g=o}}
      if(g&&gd<320){fx+=(g.x-R.px)/gd*.03;fy+=(g.y-R.py)/gd*.03}
      const m=Math.hypot(fx,fy);joy.x=m>0?fx/m:0;joy.y=m>0?fy/m:0;
      update(dt);
      if(state==="result"||R.dead){res=R.clearT>=0?"clear":"dead";break}
      while(R.pending>0){const c=choices();applyUp(c[(Math.random()*c.length)|0]);R.pending--}
      if(i%900===0)log.push({t:Math.round(R.t),lv:R.level,hp:Math.round(R.hp),en:R.en.length,kills:R.kills,boss:R.boss?Math.round(R.boss.hp):0});
    }
    const out={res,t:Math.round(R.t),lv:R.level,kills:R.kills,coins:Math.floor(R.coins),hp:Math.round(R.hp),ups:{...R.ups},log};
    simulating=false;joy.x=joy.y=0;R=null;state="home";S=sanitize(JSON.parse(keep));save();return out;
  }
};

/* ================= 起動 ================= */
load();applyTheme();makeIcons();renderAll();resize();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
requestAnimationFrame(frame);
})();

(function () {

      var s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1) return true;
      if (/(auto|scroll)/.test(s.overflowX) && el.scrollWidth > el.clientWidth + 1) return true;
    }
    return false;
  }
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) return;
    var t = e.target;
    if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
    if (!canScroll(t)) e.preventDefault();
  }, { passive: false });
